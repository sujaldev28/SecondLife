<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 260" fill="none">
  <rect width="1120" height="260" rx="16" fill="#090B14" stroke="#1E293B" stroke-width="1.5"/>
  <text x="32" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="700" fill="#F8FAFC">End-to-End Asset Lifecycle &amp; Commercialization Workflow</text>
  <text x="32" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94A3B8">Enforced via 17 lifecycle states and mandatory specialist verification before marketplace publication</text>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <rect x="28" y="84" width="120" height="122" rx="10" fill="#111827" stroke="#8B5CF6"/>
    <text x="88" y="112" text-anchor="middle" font-size="12" font-weight="700" fill="#A78BFA">1. Discovery</text>
    <text x="88" y="136" text-anchor="middle" font-size="11" fill="#F8FAFC">Register / Scan</text>
    <text x="88" y="154" text-anchor="middle" font-size="11" fill="#94A3B8">ZIP or Repo Sync</text>
    <text x="88" y="186" text-anchor="middle" font-size="10" fill="#34D399">Implemented</text>

    <rect x="164" y="84" width="120" height="122" rx="10" fill="#111827" stroke="#6366F1"/>
    <text x="224" y="112" text-anchor="middle" font-size="12" font-weight="700" fill="#818CF8">2. Tech Analysis</text>
    <text x="224" y="136" text-anchor="middle" font-size="11" fill="#F8FAFC">Static AST &amp;</text>
    <text x="224" y="154" text-anchor="middle" font-size="11" fill="#94A3B8">Secret/Risk Scan</text>
    <text x="224" y="186" text-anchor="middle" font-size="10" fill="#34D399">Implemented</text>

    <rect x="300" y="84" width="120" height="122" rx="10" fill="#111827" stroke="#22D3EE"/>
    <text x="360" y="112" text-anchor="middle" font-size="12" font-weight="700" fill="#22D3EE">3. Verification</text>
    <text x="360" y="136" text-anchor="middle" font-size="11" fill="#F8FAFC">Ownership, SPDX</text>
    <text x="360" y="154" text-anchor="middle" font-size="11" fill="#94A3B8">&amp; Human Gate</text>
    <text x="360" y="186" text-anchor="middle" font-size="10" fill="#34D399">Implemented</text>

    <rect x="436" y="84" width="120" height="122" rx="10" fill="#111827" stroke="#60A5FA"/>
    <text x="496" y="112" text-anchor="middle" font-size="12" font-weight="700" fill="#60A5FA">4. Valuation</text>
    <text x="496" y="136" text-anchor="middle" font-size="11" fill="#F8FAFC">Revival Effort &amp;</text>
    <text x="496" y="154" text-anchor="middle" font-size="11" fill="#94A3B8">Override Review</text>
    <text x="496" y="186" text-anchor="middle" font-size="10" fill="#34D399">Heuristic Live</text>

    <rect x="572" y="84" width="120" height="122" rx="10" fill="#111827" stroke="#34D399"/>
    <text x="632" y="112" text-anchor="middle" font-size="12" font-weight="700" fill="#34D399">5. Marketplace</text>
    <text x="632" y="136" text-anchor="middle" font-size="11" fill="#F8FAFC">Publish, Search</text>
    <text x="632" y="154" text-anchor="middle" font-size="11" fill="#94A3B8">&amp; Compare Assets</text>
    <text x="632" y="186" text-anchor="middle" font-size="10" fill="#34D399">Implemented</text>

    <rect x="708" y="84" width="120" height="122" rx="10" fill="#111827" stroke="#E879F9"/>
    <text x="768" y="112" text-anchor="middle" font-size="12" font-weight="700" fill="#E879F9">6. Matching</text>
    <text x="768" y="136" text-anchor="middle" font-size="11" fill="#F8FAFC">Buyer Specs &amp;</text>
    <text x="768" y="154" text-anchor="middle" font-size="11" fill="#94A3B8">Fit Explanations</text>
    <text x="768" y="186" text-anchor="middle" font-size="10" fill="#34D399">Implemented</text>

    <rect x="844" y="84" width="120" height="122" rx="10" fill="#111827" stroke="#8B5CF6"/>
    <text x="904" y="112" text-anchor="middle" font-size="12" font-weight="700" fill="#A78BFA">7. Deal Room</text>
    <text x="904" y="136" text-anchor="middle" font-size="11" fill="#F8FAFC">Offers, Chat &amp;</text>
    <text x="904" y="154" text-anchor="middle" font-size="11" fill="#94A3B8">Agreements</text>
    <text x="904" y="186" text-anchor="middle" font-size="10" fill="#34D399">Implemented</text>

    <rect x="980" y="84" width="112" height="122" rx="10" fill="#111827" stroke="#FBBF24"/>
    <text x="1036" y="112" text-anchor="middle" font-size="12" font-weight="700" fill="#FBBF24">8. Settlement</text>
    <text x="1036" y="136" text-anchor="middle" font-size="11" fill="#F8FAFC">License/Transfer</text>
    <text x="1036" y="154" text-anchor="middle" font-size="11" fill="#94A3B8">&amp; Handover</text>
    <text x="1036" y="186" text-anchor="middle" font-size="10" fill="#FBBF24">Partial Live</text>
