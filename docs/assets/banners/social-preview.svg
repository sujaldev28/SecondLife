<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="640" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090B14"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#090B14"/>
    </linearGradient>
    <radialGradient id="g1" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(220 180) scale(480 300)">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1060 480) scale(440 280)">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sl-a" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="sl-b" x1="64" y1="16" x2="12" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.8" stroke-opacity="0.5"/>
    </pattern>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <rect width="1280" height="640" fill="url(#g1)"/>
  <rect width="1280" height="640" fill="url(#g2)"/>

  <!-- Logo & Title -->
  <g transform="translate(96, 110)">
    <rect width="108" height="108" rx="28" fill="#111827" stroke="#2D3B55" stroke-width="2"/>
    <g transform="translate(12, 12) scale(1.3)">
      <path d="M46 21A18 18 0 0 0 15.5 22.5" stroke="url(#sl-a)" stroke-width="5" stroke-linecap="round"/>
      <path d="M18 43A18 18 0 0 0 48.5 41.5" stroke="url(#sl-b)" stroke-width="5" stroke-linecap="round"/>
      <path d="M44 13L48 22L38.5 22.5" stroke="#22D3EE" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M20 51L16 42L25.5 41.5" stroke="#34D399" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="26" y="26" width="12" height="12" rx="3.5" transform="rotate(45 32 32)" fill="url(#sl-a)"/>
    </g>
    <text x="140" y="54" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="800" letter-spacing="-1.5" fill="#F8FAFC">SecondLife</text>
    <text x="142" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="25" font-weight="600" fill="#22D3EE">Give Abandoned Digital Assets a Second Life.</text>
  </g>

  <text x="98" y="286" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#94A3B8">An AI-powered platform for discovering, evaluating, verifying,</text>
  <text x="98" y="320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#94A3B8">and commercializing underutilized software &amp; technical assets.</text>

  <!-- 4 Summary Cards -->
  <g transform="translate(96, 386)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <rect x="0" y="0" width="256" height="136" rx="16" fill="#111827" stroke="#8B5CF6" stroke-opacity="0.5"/>
    <text x="22" y="38" font-size="15" font-weight="700" fill="#A78BFA">01 · DISCOVERY</text>
    <text x="22" y="68" font-size="14" fill="#F8FAFC">GitHub, GitLab, Bitbucket</text>
    <text x="22" y="92" font-size="14" fill="#94A3B8">&amp; Safe ZIP Archive Intake</text>

    <rect x="278" y="0" width="256" height="136" rx="16" fill="#111827" stroke="#22D3EE" stroke-opacity="0.5"/>
    <text x="300" y="38" font-size="15" font-weight="700" fill="#22D3EE">02 · INTELLIGENCE</text>
    <text x="300" y="68" font-size="14" fill="#F8FAFC">Isolated Python FastAPI</text>
    <text x="300" y="92" font-size="14" fill="#94A3B8">AST, Secrets &amp; Revival Model</text>

    <rect x="556" y="0" width="256" height="136" rx="16" fill="#111827" stroke="#34D399" stroke-opacity="0.5"/>
    <text x="578" y="38" font-size="15" font-weight="700" fill="#34D399">03 · VERIFICATION</text>
    <text x="578" y="68" font-size="14" fill="#F8FAFC">Explicit Ownership Claims</text>
    <text x="578" y="92" font-size="14" fill="#94A3B8">&amp; Specialist Review Gates</text>

    <rect x="834" y="0" width="254" height="136" rx="16" fill="#111827" stroke="#60A5FA" stroke-opacity="0.5"/>
    <text x="856" y="38" font-size="15" font-weight="700" fill="#60A5FA">04 · COMMERCIALIZE</text>
    <text x="856" y="68" font-size="14" fill="#F8FAFC">Marketplace, Deal Rooms</text>
    <text x="856" y="92" font-size="14" fill="#94A3B8">&amp; Audited IP Handover</text>
  </g>

  <text x="98" y="582" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#64748B">github.com/sujaldev28/SecondLife  ·  secondlife-delta.vercel.app</text>
</svg>
