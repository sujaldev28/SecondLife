name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  node-monorepo:
    name: TypeScript, Tests & Build (Node 22)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck all workspaces
        run: npm run typecheck

      - name: Run JS/TS test suites
        run: npm test

      - name: Build production bundles
        run: npm run build

  python-ai-analyzer:
    name: Python AI Analyzer Tests (Python 3.12)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai-analyzer
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: services/ai-analyzer/requirements.txt

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run pytest
        run: pytest -v

  config-and-docs:
    name: Config & Documentation Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate JSON configs
        run: |
          node -e "JSON.parse(require('fs').readFileSync('vercel.json', 'utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('package.json', 'utf8'))"

      - name: Validate README relative links and anchors
        run: |
          node - <<'EOF'
          const fs = require('fs');
          const md = fs.readFileSync('README.md', 'utf8');
          const links = [
            ...[...md.matchAll(/\[[^\]]+\]\(([^)]+)\)/g)].map((m) => m[1]),
            ...[...md.matchAll(/href="([^"]+)"/g)].map((m) => m[1]),
            ...[...md.matchAll(/src="([^"]+)"/g)].map((m) => m[1]),
            ...[...md.matchAll(/srcset="([^"]+)"/g)].map((m) => m[1]),
          ];
          const anchors = new Set([
            ...[...md.matchAll(/^#{1,6}\s+(.+)$/gm)].map((m) =>
              m[1].trim().toLowerCase().replace(/[^\w\s-]/g, '').replace(/\s/g, '-')
            ),
            ...[...md.matchAll(/id="([^"]+)"/g)].map((m) => m[1]),
          ]);
          const missing = [];
          for (const target of links) {
            if (target.startsWith('http://') || target.startsWith('https://')) continue;
            if (target.startsWith('#')) {
              if (!anchors.has(target.slice(1))) missing.push(target);
            } else {
              const filePath = target.split('#')[0];
              if (!fs.existsSync(filePath)) missing.push(filePath);
            }
          }
          if (missing.length) {
            console.error('Broken README references:', missing);
            process.exit(1);
          }
          console.log('Verified', links.length, 'README references with 0 broken links.');
          EOF
